version: '3.8'
services:
  backend:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: backend
    ports:
      - '3000:3000'
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-}
      - PORT=3000
      - NODE_ENV=production
      - ALLOWED_ORIGINS=*
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    restart: unless-stopped
