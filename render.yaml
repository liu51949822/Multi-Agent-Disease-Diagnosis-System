# Render deployment configuration for the Multi-Agent Plastic Surgery Consultation System
# Blueprint: https://dashboard.render.com/blueprints/new?from_repo=<your-repo-url>
services:
  # Backend service (Node.js + Express + LangGraph)
  - type: web
    name: plastic-consult-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/health

  # Frontend service (React + Vite + TypeScript)
  - type: web
    name: plastic-consult-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Point to your deployed backend URL (e.g. https://plastic-consult-backend.onrender.com/api)
      - key: VITE_API_URL
        value: https://plastic-consult-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
